name: CI — Lint e Testes

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  lint:
    name: Análise estática (flake8)
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências de lint
        run: pip install flake8

      - name: Rodar flake8
        run: |
          flake8 gerenciador_remedios.py \
            --max-line-length=100 \
            --ignore=E302,E305,W503

  testes:
    name: Testes automatizados (pytest)
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Instalar dependências de display virtual (para CustomTkinter no CI)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y xvfb python3-tk

      - name: Rodar testes com display virtual
        run: xvfb-run --auto-servernum pytest testes/ -v --tb=short
